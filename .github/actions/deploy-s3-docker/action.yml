name: "Deploy to AWS S3"
description: 'Deploy a static website via AWS S3.'
inputs:
  bucket:
    description: 'The S3 bucket name.'
    required: true
    default: edu-site
  bucket-region:
    description: 'The region of S3 bucket.'
    required: false
    default: 'us-east-1'
  dist-folder:
    description: 'The folder containing the deployable files.'
    required: true
outputs:
  website-url:
    description: 'The URL of the deployed website'
# Since the runs-on parameter is part of the workflow and not the custom action definition, the VM is implicit.
runs:
 using: 'docker'
 image: 'Dockerfile'
